# Source registry
#
# Hand-curated catalogue of every news source we've ever considered for the
# space-monitor pipeline — implemented, blocked, planned, or explicitly
# decided against. The Streamlit UI joins this with live stats from the
# news_article + partnership_draft tables to render the source-management
# screen.
#
# Edit this file freely; PRs that change source status or comments are the
# audit trail for "why is X like this". The runtime pipeline does NOT read
# this file — it uses src/space_monitor/pipeline/sources/REGISTRY for code
# behaviour. This is the human-facing layer on top.
#
# Status values:
#   working          — registered in REGISTRY, runs successfully
#   disabled         — registered but disabled=True (e.g. SpaceWatch / Cloudflare)
#   blocked          — tried, failed, requires future work to unblock
#   unreachable      — blocked by network/policy from this environment
#   planned          — identified as a candidate, not yet built
#   deferred         — explicitly chose to wait
#   rejected         — decided against (with reason in comment)
#
# Type values:
#   rss              — feedparser-readable feed
#   scraper          — bespoke HTML scraper
#   search           — query-based discovery (e.g. Google News RSS-search)
#   api              — paid/auth API integration
#   manual           — human-curated only

